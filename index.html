<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A2 Speaking Files — Hotspot English School</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Кольори й шрифт: ті самі, що на сторінці онбордингу (з CSS сайту школи) */
  :root{ --bg:#fff; --panel:#f2f2f2; --ink:#080808; --ink-soft:#2f3542; --accent:#ee0012; --line:#e6e6e6;
         --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --gut:24px; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#080808; --panel:#131313; --ink:#fff; --ink-soft:#979797; --line:#2f2f2f; } }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:500; line-height:1.5}
  .top{width:100%; max-width:800px; margin:0 auto; padding:22px var(--gut); display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line)}
  .top img{display:block; height:20px; width:auto; filter:invert(1)}
  @media (prefers-color-scheme: dark){ .top img{filter:none} }
  .doc-id{font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft)}
  main{width:100%; max-width:800px; margin:0 auto; padding:0 var(--gut) 56px; flex:1}
  .eyebrow{display:flex; align-items:center; gap:14px; margin:54px 0 18px; font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
  .eyebrow::before{content:""; flex:none; width:36px; height:2px; background:var(--accent)}
  h1{margin:0 0 40px; font-weight:900; text-transform:uppercase; letter-spacing:-.02em; line-height:1.02; font-size:clamp(34px,8vw,56px)}
  .list{border-top:2px solid var(--ink); margin:0 -16px}
  .item{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 16px; color:inherit; text-decoration:none; border-bottom:1px solid var(--line); transition:background .18s,color .18s}
  .name{font-weight:900; font-size:clamp(22px,4.6vw,28px); letter-spacing:-.01em; line-height:1.1}
  .go{display:inline-flex; align-items:center; gap:10px; flex:none; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); transition:color .18s}
  .go svg{width:18px; height:18px; transition:transform .2s}
  .item:hover,.item:focus-visible{background:var(--accent); color:#fff; outline:none}
  .item:hover .go,.item:focus-visible .go{color:#fff}
  .item:hover .go svg,.item:focus-visible .go svg{transform:translateX(4px)}
  footer{background:var(--ink); padding:40px var(--gut)}
  .foot{max-width:800px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; text-align:center}
  footer .tag{font-weight:900; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--bg)}
  @media (max-width:560px){ :root{--gut:18px} .go span.t{display:none} .item{padding:18px 16px} .foot{flex-direction:column; text-align:center} }
</style>
</head>
